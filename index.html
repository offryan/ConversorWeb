<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Converta arquivos ICS (agenda) e MBOX (e-mail) para CSV ou JSON direto no navegador.">
    <title>Galatic Conversor</title>
    <link rel="icon" href="image/galatic_conversor.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="style/stars.css">
    <link rel="stylesheet" type="text/css" href="style/style.css">
</head>
<body>
    <!-- Stars Background -->
    <section class="animated-background">
      <div id="stars1"></div>
      <div id="stars2"></div>
      <div id="stars3"></div>
    </section>

    <!-- Profile -->
    <a id="profilePicture" href="#popup" title="Como usar">
      <img src="image/galatic_conversor.png" alt="Galatic Conversor">
    </a>
    <div id="userName">
      Galatic Conversor
    </div>

    <!-- Formulário -->
    <form class="section" id="formulario">
        <label for="origem">Arquivo de origem:</label>
        <select id="origem" class="form-select">
            <option value="MBOX">MBOX (e-mails)</option>
            <option value="ICS">ICS (agenda)</option>
        </select>

        <label for="destino">Converter para:</label>
        <select id="destino" class="form-select">
            <option value="CSV">CSV</option>
            <option value="JSON">JSON</option>
        </select>

        <label for="arquivo" class="visually-hidden">Arquivo</label>
        <input class="form-control" type="file" id="arquivo" accept=".mbox">
        <button type="submit" class="btn btn-outline-success" id="converter">Converter</button>
        <div id="status" role="status" aria-live="polite"></div>
    </form>

    <!-- Popup "Como usar" (aberto ao clicar na logo) -->
    <div id="popup" class="overlay">
        <div class="popup">
            <p class="popup-quote">
                <strong>Como usar</strong><br><br>
                Escolha o tipo do arquivo (MBOX para caixas de e-mail exportadas do Gmail ou do Thunderbird,
                ICS para agendas do Google Agenda ou do Outlook), o formato de saída e envie o arquivo.
                O resultado é baixado na hora.
            </p>
            <a class="popup-close" href="#" aria-label="Fechar">&times;</a>
        </div>
    </div>

    <!-- Scripts -->
    <script src="script/script.js" defer></script>
</body>
</html>
